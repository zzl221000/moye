name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests and render snapshots
        run: bun run test

      - name: Install pdftotext
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Build the static site
        run: bun run build

      # One real export through the built app: page count plus key text.
      # Exact page-by-page text is compared locally by `bun run test:e2e`;
      # CI keeps the check independent of the host pdftotext's line wrapping.
      - name: E2E export (page count + key text)
        run: node tests/e2e.mjs --ci

      # Preview pagination must agree with the real export for every fixture
      # and the paper/margin/band variants.
      - name: E2E pagination (preview = PDF)
        run: node tests/e2e.mjs --pagination
